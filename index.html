<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Atölye Stok Takip Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="toast"></div>

<div id="login">
  <div class="login-card">
    <h1>Atölye Stok Pro</h1>
    <p>Supabase Auth ile giriş yap</p>
    <input id="loginUser" placeholder="E-posta">
    <input id="loginPass" type="password" placeholder="Şifre">
    <button onclick="giris()">Giriş Yap</button>
    <small>Admin: admin@stok.com / 123456</small>
  </div>
</div>

<div id="panel" style="display:none;">
  <header>
    <div>
      <h1>Atölye Stok Paneli</h1>
      <p id="aktifKullanici"></p>
    </div>
    <button onclick="cikis()">Çıkış</button>
  </header>

  <nav>
    <button onclick="sayfaAc('dashboard')">Ana Panel</button>
    <button onclick="sayfaAc('stok')">Stoklar</button>
    <button onclick="sayfaAc('proje')">Projeler</button>
    <button id="adminBtn" onclick="sayfaAc('kullanici')">Kullanıcılar</button>
  </nav>

  <section id="dashboard" class="page">
    <div class="stats">
      <div><span>Toplam Malzeme</span><b id="toplam">0</b></div>
      <div><span>Kritik Stok</span><b id="kritik">0</b></div>
      <div><span>Toplam Proje</span><b id="projeSayisi">0</b></div>
      <div><span>Kullanıcı</span><b id="kullaniciSayisi">1</b></div>
    </div>

    <div class="chart-box">
      <h2>Stok Grafiği</h2>
      <canvas id="stokGrafik" width="900" height="300"></canvas>
    </div>
  </section>

  <section id="stok" class="page hidden">
    <div class="form-box">
      <input id="isim" placeholder="Malzeme adı">
      <input id="kategori" placeholder="Kategori">
      <input id="adet" type="number" placeholder="Adet">
      <input id="min" type="number" placeholder="Kritik sınır">
      <button onclick="malzemeEkle()">Malzeme Ekle</button>
    </div>

    <div class="search-box">
      <input id="arama" oninput="stokGoster()" placeholder="Kod, isim veya kategori ara...">
    </div>

    <table>
      <thead>
        <tr>
          <th>Kod</th>
          <th>Malzeme</th>
          <th>Kategori</th>
          <th>Adet</th>
          <th>Durum</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="stokListe"></tbody>
    </table>
  </section>

  <section id="proje" class="page hidden">
    <div class="form-box">
      <input id="projeAdi" placeholder="Proje adı">
      <input id="projeSorumlu" placeholder="Sorumlu kişi">
      <button onclick="projeEkle()">Proje Ekle</button>
    </div>

    <div class="form-box">
      <select id="projeSec"></select>
      <select id="stokSec"></select>
      <input id="bagAdet" type="number" placeholder="Kullanılacak adet">
      <button onclick="stoguProjeyeBagla()">Stoku Projeye Bağla</button>
    </div>

    <div id="projeListe" class="project-list"></div>
  </section>

  <section id="kullanici" class="page hidden">
    <table>
      <thead>
        <tr>
          <th>Kullanıcı</th>
          <th>Rol</th>
          <th>Durum</th>
        </tr>
      </thead>
      <tbody id="kullaniciListe"></tbody>
    </table>
  </section>
</div>

<script>
const SUPABASE_URL = "https://biflplzsimhotbqydqqf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3dC_1nzaTnrIHHBt0Y-NhQ_7kryfx_7";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let aktif = JSON.parse(localStorage.getItem("aktifKullanici")) || null;
let stoklar = [];
let projeler = [];

function mesaj(text, type = "ok"){
  const toast = document.getElementById("toast");
  toast.innerText = text;
  toast.className = type;
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 2500);
}

function kodUret(){
  return "STK-" + Math.floor(10000000 + Math.random() * 90000000);
}

async function giris(){
  const email = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if(error){
    mesaj("Giriş hatası: " + error.message, "error");
    return;
  }

  aktif = {
    user: data.user.email,
    rol: data.user.email === "admin@stok.com" ? "admin" : "user"
  };

  localStorage.setItem("aktifKullanici", JSON.stringify(aktif));
  mesaj("Giriş başarılı.");
  panelAc();
}

async function panelAc(){
  document.getElementById("login").style.display = "none";
  document.getElementById("panel").style.display = "block";
  document.getElementById("aktifKullanici").innerText = aktif.user + " / " + aktif.rol;
  document.getElementById("adminBtn").style.display = aktif.rol === "admin" ? "inline-block" : "none";
  await verileriCek();
}

async function cikis(){
  await db.auth.signOut();
  aktif = null;
  localStorage.removeItem("aktifKullanici");
  document.getElementById("panel").style.display = "none";
  document.getElementById("login").style.display = "flex";
  mesaj("Çıkış yapıldı.");
}

function sayfaAc(id){
  document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  tumunuGoster();
}

async function verileriCek(){
  const stokRes = await db.from("stoklar").select("*").order("id", { ascending: false });
  const projeRes = await db.from("projeler").select("*").order("id", { ascending: false });

  if(stokRes.error){
    mesaj("Stok hatası: " + stokRes.error.message, "error");
    return;
  }

  if(projeRes.error){
    mesaj("Proje hatası: " + projeRes.error.message, "error");
    return;
  }

  stoklar = stokRes.data || [];
  projeler = projeRes.data || [];
  tumunuGoster();
}

async function malzemeEkle(){
  if(aktif.rol !== "admin"){
    mesaj("Sadece admin malzeme ekleyebilir.", "error");
    return;
  }

  const isim = document.getElementById("isim").value.trim();
  const kategori = document.getElementById("kategori").value.trim();
  const adet = Number(document.getElementById("adet").value);
  const min = Number(document.getElementById("min").value);

  if(!isim || !kategori || adet < 0 || min < 0){
    mesaj("Tüm alanları doğru doldur.", "error");
    return;
  }

  const { error } = await db.from("stoklar").insert({
    kod: kodUret(),
    isim,
    kategori,
    adet,
    min
  });

  if(error){
    mesaj("Ekleme hatası: " + error.message, "error");
    return;
  }

  document.getElementById("isim").value = "";
  document.getElementById("kategori").value = "";
  document.getElementById("adet").value = "";
  document.getElementById("min").value = "";

  mesaj("Malzeme eklendi.");
  await verileriCek();
}

async function stokDegistir(i, miktar){
  if(aktif.rol !== "admin"){
    mesaj("Sadece admin stok değiştirebilir.", "error");
    return;
  }

  const stok = stoklar[i];
  let yeniAdet = stok.adet + miktar;
  if(yeniAdet < 0) yeniAdet = 0;

  const { error } = await db.from("stoklar")
    .update({ adet: yeniAdet })
    .eq("id", stok.id);

  if(error){
    mesaj("Güncelleme hatası: " + error.message, "error");
    return;
  }

  mesaj("Stok güncellendi.");
  await verileriCek();
}

async function stokSil(i){
  if(aktif.rol !== "admin"){
    mesaj("Sadece admin silebilir.", "error");
    return;
  }

  if(!confirm("Bu stoğu silmek istiyor musun?")) return;

  const { error } = await db.from("stoklar")
    .delete()
    .eq("id", stoklar[i].id);

  if(error){
    mesaj("Silme hatası: " + error.message, "error");
    return;
  }

  mesaj("Stok silindi.");
  await verileriCek();
}

function stokGoster(){
  const arama = document.getElementById("arama")?.value.toLowerCase() || "";

  const filtre = stoklar.filter(s =>
    s.kod.toLowerCase().includes(arama) ||
    s.isim.toLowerCase().includes(arama) ||
    s.kategori.toLowerCase().includes(arama)
  );

  document.getElementById("stokListe").innerHTML = filtre.map(s => {
    const i = stoklar.indexOf(s);
    const kritik = s.adet <= s.min;

    return `
      <tr class="${kritik ? "low-row" : ""}">
        <td>${s.kod}</td>
        <td>${s.isim}</td>
        <td>${s.kategori}</td>
        <td>
          <button onclick="stokDegistir(${i}, -1)">-</button>
          ${s.adet}
          <button onclick="stokDegistir(${i}, 1)">+</button>
        </td>
        <td><span class="badge ${kritik ? "danger" : "good"}">${kritik ? "Kritik" : "Yeterli"}</span></td>
        <td><button class="delete" onclick="stokSil(${i})">Sil</button></td>
      </tr>
    `;
  }).join("");
}

async function projeEkle(){
  const ad = document.getElementById("projeAdi").value.trim();
  const sorumlu = document.getElementById("projeSorumlu").value.trim();

  if(!ad || !sorumlu){
    mesaj("Proje adı ve sorumlu kişi gerekli.", "error");
    return;
  }

  const { error } = await db.from("projeler").insert({ ad, sorumlu });

  if(error){
    mesaj("Proje ekleme hatası: " + error.message, "error");
    return;
  }

  document.getElementById("projeAdi").value = "";
  document.getElementById("projeSorumlu").value = "";

  mesaj("Proje eklendi.");
  await verileriCek();
}

async function stoguProjeyeBagla(){
  const projeId = Number(document.getElementById("projeSec").value);
  const stokId = Number(document.getElementById("stokSec").value);
  const adet = Number(document.getElementById("bagAdet").value);
  const stok = stoklar.find(s => s.id === stokId);

  if(!projeId || !stok || adet <= 0){
    mesaj("Alanları doğru doldur.", "error");
    return;
  }

  if(stok.adet < adet){
    mesaj("Yeterli stok yok.", "error");
    return;
  }

  const { error: bagError } = await db.from("proje_stoklari").insert({
    proje_id: projeId,
    stok_id: stok.id,
    stok_adi: stok.isim,
    adet
  });

  if(bagError){
    mesaj("Projeye stok bağlama hatası: " + bagError.message, "error");
    return;
  }

  const { error: stokError } = await db.from("stoklar")
    .update({ adet: stok.adet - adet })
    .eq("id", stok.id);

  if(stokError){
    mesaj("Stok azaltma hatası: " + stokError.message, "error");
    return;
  }

  document.getElementById("bagAdet").value = "";
  mesaj("Stok projeye bağlandı.");
  await verileriCek();
}

async function projeGoster(){
  document.getElementById("projeSec").innerHTML = projeler.map(p =>
    `<option value="${p.id}">${p.ad}</option>`
  ).join("");

  document.getElementById("stokSec").innerHTML = stoklar.map(s =>
    `<option value="${s.id}">${s.isim} / ${s.adet} adet</option>`
  ).join("");

  const { data, error } = await db.from("proje_stoklari").select("*");
  const baglar = error ? [] : data || [];

  document.getElementById("projeListe").innerHTML = projeler.map(p => {
    const projeBaglari = baglar.filter(b => b.proje_id === p.id);

    return `
      <div class="project-card">
        <h3>${p.ad}</h3>
        <p>Sorumlu: ${p.sorumlu}</p>
        <h4>Bağlı Stoklar</h4>
        ${
          projeBaglari.length
          ? projeBaglari.map(b => `<p>${b.stok_adi} - ${b.adet} adet</p>`).join("")
          : "<p>Henüz stok bağlanmadı.</p>"
        }
      </div>
    `;
  }).join("");
}

function kullaniciGoster(){
  document.getElementById("kullaniciListe").innerHTML = `
    <tr>
      <td>${aktif ? aktif.user : "-"}</td>
      <td>${aktif ? aktif.rol : "-"}</td>
      <td>Aktif</td>
    </tr>
  `;
}

function dashboardGoster(){
  document.getElementById("toplam").innerText = stoklar.length;
  document.getElementById("kritik").innerText = stoklar.filter(s => s.adet <= s.min).length;
  document.getElementById("projeSayisi").innerText = projeler.length;
  document.getElementById("kullaniciSayisi").innerText = "1";
  grafikCiz();
}

function grafikCiz(){
  const canvas = document.getElementById("stokGrafik");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const max = Math.max(...stoklar.map(s => s.adet), 1);

  stoklar.slice(0, 8).forEach((s, i) => {
    const h = (s.adet / max) * 210;
    const x = 50 + i * 90;
    const y = 250 - h;

    ctx.fillStyle = s.adet <= s.min ? "#ef4444" : "#38bdf8";
    ctx.fillRect(x, y, 55, h);

    ctx.fillStyle = "#e5e7eb";
    ctx.font = "12px Arial";
    ctx.fillText(s.isim.slice(0, 8), x, 275);
    ctx.fillText(s.adet, x + 18, y - 8);
  });
}

function tumunuGoster(){
  dashboardGoster();
  stokGoster();
  projeGoster();
  kullaniciGoster();
}

document.addEventListener("keydown", e => {
  if(e.key === "Enter" && document.getElementById("login").style.display !== "none"){
    giris();
  }
});

if(aktif){
  panelAc();
}
</script>

</body>
</html>
